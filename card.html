<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Slider Magic - CSS Animation</title>
    <style>
        /* Reset and base setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a24;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Perspective gives the 3D depth effect seen in the video */
            perspective: 1200px;
        }

        .slideshow {
            position: relative;
            width: 350px;
            height: 250px;
            transform-style: preserve-3d;
        }

        .card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);

            /* Start cards hidden and pushed back/right in 3D space */
            opacity: 0;
            transform: translateX(150%) translateZ(-600px) rotateY(-20deg);

            /* 12 seconds total loop. 4 cards = exactly 3 seconds between each card */
            animation: slideMagic 12s infinite;
        }

        /* Stagger the animation delays so one card enters as the other exits */
        .card:nth-child(1) {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            animation-delay: 0s;
        }

        .card:nth-child(2) {
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
            animation-delay: 3s;
        }

        .card:nth-child(3) {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            animation-delay: 6s;
        }

        .card:nth-child(4) {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            animation-delay: 9s;
        }

        /* The Keyframes that mimic the After Effects timeline */
        @keyframes slideMagic {
            0% {
                /* Far right, deep in the background */
                transform: translateX(150%) translateZ(-600px) rotateY(-20deg);
                opacity: 0;
                animation-timing-function: ease-out;
            }

            6% {
                /* The "Bounce/Anticipation" overshoot effect from the tutorial */
                transform: translateX(-8%) translateZ(40px) rotateY(8deg);
                opacity: 1;
                animation-timing-function: ease-in-out;
            }

            10%,
            25% {
                /* Settled in the center of the screen */
                transform: translateX(0%) translateZ(0px) rotateY(0deg);
                opacity: 1;
                animation-timing-function: ease-in;
            }

            31% {
                /* Exit to the far left and fade out */
                transform: translateX(-150%) translateZ(-600px) rotateY(20deg);
                opacity: 0;
            }

            100% {
                /* Keep it hidden for the rest of the 12 second cycle */
                transform: translateX(-150%) translateZ(-600px) rotateY(20deg);
                opacity: 0;
            }
        }

        /* Decorative icons inside cards */
        .icon {
            font-size: 4rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.2));
        }
    </style>
</head>

<body>

    <div class="slideshow">
        <div class="card">
            <div class="icon">🚀</div>
            <span>Slide One</span>
        </div>
        <div class="card">
            <div class="icon">✨</div>
            <span>Slide Two</span>
        </div>
        <div class="card">
            <div class="icon">💡</div>
            <span>Slide Three</span>
        </div>
        <div class="card">
            <div class="icon">🎉</div>
            <span>Slide Four</span>
        </div>
    </div>

</body>

</html>
