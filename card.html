<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll-Driven 3D Card Carousel</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #d3d3d3;
            /* Light grey background from your image */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* The Scrolling Container */
        .carousel-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            overflow-x: auto;
            /* This creates the smooth snapping effect to the center */
            scroll-snap-type: x mandatory;
            /* Hide scrollbar for clean UI */
            scrollbar-width: none;
            -ms-overflow-style: none;
            /* Perspective gives the 3D depth */
            perspective: 1000px;
        }

        .carousel-container::-webkit-scrollbar {
            display: none;
        }

        /* Padding allows the first and last cards to reach the center of the screen */
        .carousel-track {
            display: flex;
            align-items: center;
            gap: 30px;
            /* Space between cards */
            padding: 0 calc(50vw - 175px);
            /* 175px is half of the card width (350/2) */
        }

        /* The Card Styling */
        .card {
            width: 350px;
            height: 250px;
            background: #fff;
            border-radius: 12px;
            flex-shrink: 0;
            /* Prevents cards from squishing */
            scroll-snap-align: center;
            /* Forces card to snap to center when scrolling stops */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;

            /* We handle the actual movement/scaling in JS, but we transition it smoothly */
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
            transform-origin: center center;
        }

        /* Decorative Inner Content simulating your image */
        .card-image-placeholder {
            width: 100%;
            height: 160px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            border-top: 2px solid #eee;
            padding-top: 10px;
        }

        /* Hardcoded colors for demonstration */
        .card:nth-child(1) .card-image-placeholder {
            background: #ffbba1;
        }

        .card:nth-child(2) .card-image-placeholder {
            background: #b0c4de;
        }

        .card:nth-child(3) .card-image-placeholder {
            background: #e3d5ca;
        }

        /* Center card color */
        .card:nth-child(4) .card-image-placeholder {
            background: #dcdcdc;
        }

        .card:nth-child(5) .card-image-placeholder {
            background: #ffcccb;
        }
    </style>
</head>

<body>

    <div class="carousel-container" id="container">
        <div class="carousel-track">
            <div class="card">
                <div class="card-image-placeholder">📄</div>
                <div class="card-title">Turn Page Animation</div>
            </div>
            <div class="card">
                <div class="card-image-placeholder">👩‍🦰</div>
                <div class="card-title">Pro Hover Animation</div>
            </div>
            <div class="card">
                <div class="card-image-placeholder">🪴</div>
                <div class="card-title">3D Rotating layers</div>
            </div>
            <div class="card">
                <div class="card-image-placeholder">👨‍💼</div>
                <div class="card-title">Twisting layers</div>
            </div>
            <div class="card">
                <div class="card-image-placeholder">🛋️</div>
                <div class="card-title">Bending the layers</div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const cards = document.querySelectorAll('.card');

        function updateCardsOnScroll() {
            // Find the exact center of the screen
            const containerCenter = window.innerWidth / 2;

            cards.forEach(card => {
                // Get the bounding box of each card
                const rect = card.getBoundingClientRect();
                const cardCenter = rect.left + (rect.width / 2);

                // Calculate how far the card is from the center of the screen
                const distanceFromCenter = Math.abs(containerCenter - cardCenter);

                // Calculate scale based on distance. 
                // The further away, the smaller it gets. Max scale is 1, min scale is 0.7.
                let scale = 1 - (distanceFromCenter / window.innerWidth) * 0.8;
                scale = Math.max(0.7, scale);

                // Adjust opacity slightly for outer cards to fade them back
                let opacity = 1 - (distanceFromCenter / window.innerWidth) * 0.5;
                opacity = Math.max(0.4, opacity);

                // Apply the scale and manage the z-index so the center card is always on top
                card.style.transform = `scale(${scale})`;
                card.style.opacity = opacity;
                card.style.zIndex = Math.round(scale * 100);
            });
        }

        // Listen to the scroll event on the container
        container.addEventListener('scroll', updateCardsOnScroll);
        // Also run on window resize to recalculate math
        window.addEventListener('resize', updateCardsOnScroll);

        // Trigger once on load to set initial state
        updateCardsOnScroll();

        // Optional: Auto-scroll to the middle card on load (Card 3)
        window.onload = () => {
            const middleCard = cards[2];
            middleCard.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        };
    </script>

</body>

</html>
